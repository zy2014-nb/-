<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的高考主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:linear-gradient(135deg,#1a202c 0%,#2d3748 100%);
            color:#fff;
            font-family:"Microsoft Yahei",sans-serif;
            min-height:100vh;
            padding:30px 20px;
        }
        .container{max-width:900px;margin:0 auto;}

        /* 倒计时区 */
        .countdown-section{text-align:center;margin-bottom:40px;}
        h1{font-size:38px;margin-bottom:8px;}
        .sub{color:#a0aec0;font-size:15px;margin-bottom:25px;}
        .time-box{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;}
        .item{
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            padding:20px 15px;
            border-radius:12px;
            text-align:center;
            min-width:95px;
            border:1px solid rgba(255,255,255,0.1);
        }
        .num{font-size:42px;font-weight:bold;color:#ffd166;line-height:1;}
        .text{font-size:14px;margin-top:6px;color:#cbd5e0;}

        /* 标签页 */
        .tabs{display:flex;gap:10px;margin-bottom:25px;flex-wrap:wrap;}
        .tab{
            padding:10px 18px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:8px;
            cursor:pointer;
            font-size:14px;
            color:#cbd5e0;
        }
        .tab.active{background:#ffd166;color:#1a202c;font-weight:bold;border-color:#ffd166;}

        /* 面板 */
        .panel{
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:14px;
            padding:25px;
            margin-bottom:20px;
        }
        .panel h2{font-size:20px;margin-bottom:18px;color:#e2e8f0;}

        /* 志愿表单 */
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px;}
        .form-grid .full{grid-column:1/-1;}
        .field label{display:block;font-size:13px;color:#a0aec0;margin-bottom:5px;}
        .field input,.field select,.field textarea{
            width:100%;
            background:rgba(0,0,0,0.3);
            border:1px solid rgba(255,255,255,0.15);
            color:#fff;
            padding:10px 12px;
            border-radius:6px;
            font-size:14px;
            font-family:inherit;
        }
        .field input,.field select{color-scheme:dark;}
        .field textarea{resize:vertical;min-height:60px;}

        .btn{
            background:#ffd166;color:#1a202c;border:none;
            padding:11px 22px;border-radius:6px;
            font-size:15px;cursor:pointer;font-weight:bold;
        }
        .btn:hover{background:#f4c430;}
        .btn-sm{
            padding:6px 12px;font-size:13px;
            background:transparent;border:1px solid rgba(255,255,255,0.2);
            color:#cbd5e0;
        }
        .btn-sm:hover{background:rgba(255,255,255,0.1);}
        .btn-danger{background:transparent;border:1px solid #fc8181;color:#fc8181;}
        .btn-danger:hover{background:rgba(252,129,129,0.15);}

        /* 志愿卡片 */
        .volunteer-list{display:flex;flex-direction:column;gap:12px;}
        .volunteer-card{
            background:rgba(0,0,0,0.2);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:10px;
            padding:15px 18px;
            display:flex;justify-content:space-between;align-items:flex-start;gap:15px;
        }
        .vol-info{flex:1;}
        .vol-school{font-size:18px;font-weight:bold;color:#fff;margin-bottom:4px;}
        .vol-major{font-size:14px;color:#ffd166;margin-bottom:6px;}
        .vol-note{font-size:13px;color:#a0aec0;}
        .tag{
            display:inline-block;padding:3px 10px;border-radius:12px;
            font-size:12px;margin-left:8px;vertical-align:middle;
        }
        .tag-chong{background:#fc818133;color:#fc8181;}
        .tag-wen{background:#f6ad5533;color:#f6ad55;}
        .tag-bao{background:#68d39133;color:#68d391;}
        .vol-actions{display:flex;gap:8px;flex-shrink:0;}
        .empty{text-align:center;color:#718096;padding:40px 20px;font-size:14px;}

        /* 大学搜索 */
        .search-box{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;}
        .search-box input,.search-box select{
            flex:1;min-width:150px;
            background:rgba(0,0,0,0.3);
            border:1px solid rgba(255,255,255,0.15);
            color:#fff;padding:11px 14px;border-radius:6px;font-size:14px;
            color-scheme:dark;
        }
        .result-count{font-size:13px;color:#a0aec0;margin-bottom:12px;}
        .uni-list{display:flex;flex-direction:column;gap:10px;}
        .uni-card{
            background:rgba(0,0,0,0.2);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:10px;
            padding:15px 18px;
        }
        .uni-name{font-size:17px;font-weight:bold;color:#fff;margin-bottom:6px;}
        .uni-country{
            display:inline-block;
            background:rgba(255,209,102,0.15);
            color:#ffd166;
            padding:2px 10px;
            border-radius:10px;
            font-size:12px;
            margin-bottom:8px;
        }
        .uni-link{font-size:13px;}
        .uni-link a{color:#63b3ed;text-decoration:none;word-break:break-all;}
        .uni-link a:hover{text-decoration:underline;}
        .uni-add{margin-top:10px;}
        .loading{text-align:center;padding:30px;color:#a0aec0;font-size:14px;}
        .error{text-align:center;padding:20px;color:#fc8181;font-size:14px;}

        /* 设置 */
        .settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
        .settings-row label{font-size:14px;color:#cbd5e0;}
        .settings-row input{
            background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);
            color:#fff;padding:8px 10px;border-radius:6px;font-size:14px;color-scheme:dark;
        }

        .hidden{display:none;}
        .tip-small{font-size:12px;color:#718096;margin-top:8px;line-height:1.6;}
    </style>
</head>
<body>
<div class="container">

    <!-- 倒计时 -->
    <div class="countdown-section">
        <h1>距离高考还有</h1>
        <div class="sub" id="targetLabel">2032年6月7日</div>
        <div class="time-box">
            <div class="item"><div class="num" id="day">0</div><div class="text">天</div></div>
            <div class="item"><div class="num" id="hour">0</div><div class="text">时</div></div>
            <div class="item"><div class="num" id="min">0</div><div class="text">分</div></div>
            <div class="item"><div class="num" id="sec">0</div><div class="text">秒</div></div>
        </div>
    </div>

    <!-- 标签页 -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('volunteer',this)">🎯 我的志愿</div>
        <div class="tab" onclick="switchTab('library',this)">🏫 大学库</div>
        <div class="tab" onclick="switchTab('settings',this)">⚙️ 设置</div>
    </div>

    <!-- 志愿页 -->
    <div id="tab-volunteer">
        <div class="panel">
            <h2>➕ 添加我的目标大学</h2>
            <div class="form-grid">
                <div class="field">
                    <label>大学名称</label>
                    <input type="text" id="school" placeholder="例如：浙江大学">
                </div>
                <div class="field">
                    <label>想学的专业</label>
                    <input type="text" id="major" placeholder="例如：计算机科学与技术">
                </div>
                <div class="field">
                    <label>志愿类型</label>
                    <select id="type">
                        <option value="chong">冲刺 🚀</option>
                        <option value="wen">稳妥 ✅</option>
                        <option value="bao">保底 🛡️</option>
                    </select>
                </div>
                <div class="field">
                    <label>城市（可选）</label>
                    <input type="text" id="city" placeholder="例如：杭州">
                </div>
                <div class="field full">
                    <label>备注 / 为什么想考这里</label>
                    <textarea id="note" placeholder="比如：这个专业全国排名前5，校园很美..."></textarea>
                </div>
            </div>
            <button class="btn" onclick="addVolunteer()">加入我的志愿清单</button>
        </div>

        <div class="panel">
            <h2>📋 我的志愿清单</h2>
            <div class="volunteer-list" id="volunteerList"></div>
        </div>
    </div>

    <!-- 大学库 -->
    <div id="tab-library" class="hidden">
        <div class="panel">
            <h2>🔍 搜索全世界的大学</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="输入大学名称，如：Tsinghua / Peking / Harvard" onkeydown="if(event.key==='Enter')doSearch()">
                <select id="searchCountry">
                    <option value="">全部国家</option>
                    <option value="China" selected>中国 China</option>
                    <option value="United States">美国 USA</option>
                    <option value="United Kingdom">英国 UK</option>
                    <option value="Japan">日本 Japan</option>
                    <option value="South Korea">韩国 Korea</option>
                    <option value="Australia">澳大利亚 Australia</option>
                    <option value="Canada">加拿大 Canada</option>
                    <option value="Germany">德国 Germany</option>
                    <option value="France">法国 France</option>
                    <option value="Singapore">新加坡 Singapore</option>
                    <option value="Hong Kong">中国香港 Hong Kong</option>
                    <option value="Taiwan">中国台湾 Taiwan</option>
                </select>
                <button class="btn" onclick="doSearch()">搜索</button>
            </div>
            <div class="tip-small">
                💡 提示：国内大学建议用英文拼音搜索更准确（如"Peking"、"Tsinghua"、"Zhejiang"），也支持中文模糊搜索。点击大学官网可以直接访问学校主页。
            </div>
        </div>

        <div class="panel">
            <h2>📚 搜索结果</h2>
            <div id="searchStatus">
                <div class="empty">输入大学名称开始搜索吧～</div>
            </div>
            <div class="result-count" id="resultCount"></div>
            <div class="uni-list" id="uniList"></div>
        </div>
    </div>

    <!-- 设置页 -->
    <div id="tab-settings" class="hidden">
        <div class="panel">
            <h2>⚙️ 高考日期设置</h2>
            <div class="settings-row">
                <label>出生日期</label>
                <input type="date" id="birthDate" value="2014-01-01">
            </div>
            <div class="settings-row">
                <label>高考日期</label>
                <input type="date" id="examDate">
            </div>
            <button class="btn" onclick="saveSettings()">保存设置</button>
        </div>
        <div class="panel">
            <h2>🗑️ 数据管理</h2>
            <p style="font-size:13px;color:#a0aec0;margin-bottom:12px;">清除所有志愿记录和设置（不可恢复）</p>
            <button class="btn btn-danger" onclick="clearAll()">清除全部数据</button>
        </div>
    </div>

</div>

<script>
// ========== 标签页切换 ==========
function switchTab(name, el){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    ['volunteer','library','settings'].forEach(t=>{
        document.getElementById('tab-'+t).classList.toggle('hidden', t!==name);
    });
}

// ========== 倒计时 ==========
const DEFAULT_BIRTH = "2014-01-01";
let targetTime;

function loadExamDate(){
    const birth = localStorage.getItem("birthDate") || DEFAULT_BIRTH;
    let exam = localStorage.getItem("examDate");
    if(!exam){
        const y = parseInt(birth.split("-")[0]);
        exam = (y + 18) + "-06-07";
    }
    document.getElementById("birthDate").value = birth;
    document.getElementById("examDate").value = exam;
    updateLabel(exam);
    targetTime = new Date(exam + "T09:00:00").getTime();
}

function updateLabel(dateStr){
    const d = new Date(dateStr);
    document.getElementById("targetLabel").innerText =
        `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

document.getElementById("birthDate").addEventListener("change", function(){
    const y = parseInt(this.value.split("-")[0]);
    if(y) document.getElementById("examDate").value = y + 18 + "-06-07";
});

function saveSettings(){
    localStorage.setItem("birthDate", document.getElementById("birthDate").value);
    localStorage.setItem("examDate", document.getElementById("examDate").value);
    loadExamDate();
    alert("设置已保存 ✅");
}

function countDown(){
    const now = new Date().getTime();
    const diff = targetTime - now;
    if(diff <= 0){
        document.getElementById("day").innerText = "🎉";
        document.getElementById("hour").innerText = "0";
        document.getElementById("min").innerText = "0";
        document.getElementById("sec").innerText = "0";
        return;
    }
    document.getElementById("day").innerText = Math.floor(diff/86400000);
    document.getElementById("hour").innerText = Math.floor(diff%86400000/3600000);
    document.getElementById("min").innerText = Math.floor(diff%3600000/60000);
    document.getElementById("sec").innerText = Math.floor(diff%60000/1000);
}

// ========== 志愿清单 ==========
let volunteers = JSON.parse(localStorage.getItem("volunteers") || "[]");

function addVolunteer(){
    const school = document.getElementById("school").value.trim();
    const major = document.getElementById("major").value.trim();
    const type = document.getElementById("type").value;
    const city = document.getElementById("city").value.trim();
    const note = document.getElementById("note").value.trim();
    if(!school){ alert("请填写大学名称"); return; }
    volunteers.push({school, major, type, city, note, id: Date.now()});
    localStorage.setItem("volunteers", JSON.stringify(volunteers));
    document.getElementById("school").value = "";
    document.getElementById("major").value = "";
    document.getElementById("city").value = "";
    document.getElementById("note").value = "";
    renderList();
}

function deleteVolunteer(id){
    volunteers = volunteers.filter(v => v.id !== id);
    localStorage.setItem("volunteers", JSON.stringify(volunteers));
    renderList();
}

function addToMyList(name, country){
    document.getElementById("school").value = name;
    if(country) document.getElementById("note").value = "来自大学库搜索 · " + country;
    switchTab('volunteer', document.querySelectorAll('.tab')[0]);
    alert("已填入大学名称，补全其他信息后点保存即可～");
}

function renderList(){
    const list = document.getElementById("volunteerList");
    if(volunteers.length === 0){
        list.innerHTML = '<div class="empty">还没有添加志愿，先在上方添加你的目标大学吧～</div>';
        return;
    }
    const typeMap = {
        chong: {label:"冲刺", cls:"tag-chong"},
        wen:   {label:"稳妥", cls:"tag-wen"},
        bao:   {label:"保底", cls:"tag-bao"}
    };
    list.innerHTML = volunteers.map(v => {
        const t = typeMap[v.type] || typeMap.wen;
        return `
        <div class="volunteer-card">
            <div class="vol-info">
                <div class="vol-school">${esc(v.school)}<span class="tag ${t.cls}">${t.label}</span></div>
                ${v.major ? `<div class="vol-major">📚 ${esc(v.major)}${v.city ? ' · 📍 '+esc(v.city) : ''}</div>` : (v.city ? `<div class="vol-major">📍 ${esc(v.city)}</div>` : '')}
                ${v.note ? `<div class="vol-note">💬 ${esc(v.note)}</div>` : ''}
            </div>
            <div class="vol-actions">
                <button class="btn-sm btn-danger" onclick="deleteVolunteer(${v.id})">删除</button>
            </div>
        </div>`;
    }).join('');
}

function esc(s){
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
}

// ========== 大学库搜索（调用免费公开API） ==========
async function doSearch(){
    const name = document.getElementById("searchInput").value.trim();
    const country = document.getElementById("searchCountry").value;
    const statusEl = document.getElementById("searchStatus");
    const listEl = document.getElementById("uniList");
    const countEl = document.getElementById("resultCount");

    if(!name){
        statusEl.innerHTML = '<div class="empty">请输入大学名称</div>';
        listEl.innerHTML = '';
        countEl.innerText = '';
        return;
    }

    statusEl.innerHTML = '<div class="loading">🔍 正在搜索...</div>';
    listEl.innerHTML = '';
    countEl.innerText = '';

    try{
        let url = "https://universities.hipolabs.com/search?name=" + encodeURIComponent(name);
        if(country) url += "&country=" + encodeURIComponent(country);
        const res = await fetch(url);
        const data = await res.json();

        if(!data || data.length === 0){
            statusEl.innerHTML = '<div class="empty">没找到相关大学，换个关键词试试？<br>（国内大学建议用英文拼音搜索）</div>';
            return;
        }

        statusEl.innerHTML = '';
        countEl.innerText = `共找到 ${data.length} 所大学`;

        const show = data.slice(0, 30);
        listEl.innerHTML = show.map(u => {
            const site = (u.web_pages && u.web_pages[0]) || '';
            const domain = (u.domains && u.domains[0]) || '';
            const safeName = esc(u.name).replace(/'/g,"\\'");
            const safeCountry = esc(u.country || '');
            return `
            <div class="uni-card">
                <div class="uni-name">${esc(u.name)}</div>
                <span class="uni-country">🌍 ${safeCountry}</span>
                ${site ? `<div class="uni-link">🔗 <a href="${site}" target="_blank" rel="noopener">${esc(site)}</a></div>` : ''}
                ${domain && !site ? `<div class="uni-link">🌐 ${esc(domain)}</div>` : ''}
                <div class="uni-add">
                    <button class="btn-sm" onclick="addToMyList('${safeName}','${safeCountry}')">+ 加入我的志愿</button>
                </div>
            </div>`;
        }).join('');
    }catch(err){
        statusEl.innerHTML = '<div class="error">网络请求失败，请检查网络后重试</div>';
        console.error(err);
    }
}

// ========== 清空数据 ==========
function clearAll(){
    if(confirm("确定要清除所有志愿记录和设置吗？此操作不可恢复！")){
        localStorage.removeItem("volunteers");
        localStorage.removeItem("examDate");
        localStorage.removeItem("birthDate");
        volunteers = [];
        renderList();
        loadExamDate();
        alert("已全部清除");
    }
}

// ========== 初始化 ==========
loadExamDate();
renderList();
countDown();
setInterval(countDown, 1000);
</script>
</body>
</html>
